<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yabi Junior · Try a lesson: Spending Smart</title>
<meta name="description" content="Try Lesson 4 of Yabi Junior, Spending Smart. The other 15 lessons unlock for partner schools.">
<meta name="robots" content="noindex,follow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..600&display=swap">
<style>
/* =====================================================================
   Yabi Junior · lesson + microsim template  (v1.0)
   Layout: the demo's reading layout — a quiet sidebar of section titles
   and one ~700px reading column; microsims sit in the column as the only
   "objects" on the page (card, shadow), everything else is plain prose.
   Colour: Yabi plum (characters) + money green; sun and coral are
   semantic only (try again / over budget). Single light theme by design.
   RTL-ready: logical properties only; flip with <html dir="rtl">.
   ===================================================================== */
:root{
  --paper:#fbf8f6;      /* page */
  --panel:#ffffff;      /* microsim surface */
  --rail:#f4efe9;       /* sidebar, quiet fills (warm beige) */
  --ink:#2a2631;
  --muted:#686274;
  --faint:#9b95a6;
  --line:#ebe6ef;
  --line-strong:#d9d2e1;

  --plum:#6b4bc4;       /* brand accent — Yabi characters */
  --plum-deep:#45308f;
  --plum-soft:#f0ebfb;
  --mint:#15a15a;       /* money / correct */
  --mint-deep:#0e5f37;
  --mint-soft:#e4f5eb;
  --sun:#f0b22e;        /* try again */
  --sun-deep:#674506;
  --sun-soft:#fdf3da;
  --coral:#cf5240;      /* over budget / wrong drop */
  --coral-deep:#87291c;
  --coral-soft:#fbe8e4;

  --display:"Bricolage Grotesque", "Segoe UI", system-ui, -apple-system, sans-serif;
  --body:"Literata", Charter, "Iowan Old Style", Georgia, serif;
  /* Arabic: add e.g. "IBM Plex Sans Arabic" / "Noto Naskh Arabic" at the front of each stack */

  --r-sm:8px; --r-md:12px; --r-lg:18px;
  --shadow-sim:0 1px 0 rgba(69,48,143,.04), 0 14px 34px -22px rgba(69,48,143,.38);
  --ease:cubic-bezier(.22,.8,.3,1);
  --spring:cubic-bezier(.34,1.45,.5,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.62;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--plum);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;color:var(--ink)}
strong{font-weight:700}

/* ---------------- app shell ---------------- */
.app{display:flex;min-height:100vh}
.sb{flex:none;width:286px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow:auto;background:var(--rail);border-inline-end:1px solid var(--line);padding:18px 12px 28px;font-family:var(--display)}
.sb-brand{display:flex;align-items:baseline;gap:8px;padding:2px 10px 18px;text-decoration:none;color:var(--ink)}
.sb-brand b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.sb-brand span{font-size:12px;font-weight:700;color:var(--plum);background:var(--plum-soft);padding:2px 8px;border-radius:999px}
.sb-label{padding:14px 10px 6px;font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.sb-lesson{display:flex;gap:10px;align-items:baseline;width:100%;border:0;background:none;text-align:start;cursor:pointer;font-family:var(--display);padding:8px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-size:15px;font-weight:600;line-height:1.3}
.sb-lesson:hover{background:rgba(70,52,34,.06);color:var(--ink)}
.sb-lesson .n{flex:none;min-width:22px;font-size:12.5px;font-weight:800;color:var(--faint);font-variant-numeric:tabular-nums}
.sb-lesson.current{background:var(--panel);color:var(--ink);font-weight:750;box-shadow:0 1px 2px rgba(42,38,49,.06)}
.sb-lesson.current .n{color:var(--plum)}
.sb-sections{list-style:none;margin:4px 0 10px;padding:0 0 0 18px;padding-inline:18px 0;position:relative}
.sb-sections::before{content:"";position:absolute;inset-block:6px;inset-inline-start:21px;width:1.5px;background:var(--line-strong)}
.sb-sec{display:flex;align-items:flex-start;gap:10px;width:100%;padding:7px 10px;border:0;background:none;border-radius:8px;text-align:start;cursor:pointer;font-family:var(--display);font-size:14.5px;font-weight:550;line-height:1.35;color:var(--muted)}
.sb-sec:hover{background:rgba(70,52,34,.06);color:var(--ink)}
.sb-sec.active{color:var(--ink);font-weight:750}
.sb-dot{position:relative;z-index:1;flex:none;width:8px;height:8px;margin-top:6px;border-radius:999px;background:var(--rail);box-shadow:0 0 0 1.5px var(--line-strong);transition:background .3s,box-shadow .3s}
.sb-sec.active .sb-dot{background:var(--plum);box-shadow:0 0 0 1.5px var(--plum),0 0 0 4px var(--plum-soft)}
.sb-sec.done .sb-dot{background:var(--mint);box-shadow:0 0 0 1.5px var(--mint)}
.sb-progress{margin:18px 10px 0;font-size:13px;font-weight:650;color:var(--muted)}
.sb-progress .track{height:6px;border-radius:999px;background:var(--line);margin-top:7px;overflow:hidden}
.sb-progress .fill{height:100%;width:0;background:var(--mint);border-radius:999px;transition:width .6s var(--ease)}

.topbar{display:none}
.main{flex:1;min-width:0;display:flex;justify-content:center}
.page{width:100%;max-width:780px;padding:40px 40px 80px}

/* ---------------- lesson header ---------------- */
.crumb{font-family:var(--display);font-size:14px;font-weight:650;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:14px}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;background:var(--plum-soft);color:var(--plum-deep);font-size:12.5px;font-weight:750}
.lesson-num{font-family:var(--display);font-weight:800;font-size:15px;color:var(--plum);letter-spacing:.02em;margin-bottom:6px}
h1.lesson-title{font-size:clamp(34px,5.4vw,48px);line-height:1.06;letter-spacing:-.035em;font-weight:800;margin-bottom:22px}
.objectives{font-family:var(--display);border-block:1px solid var(--line);padding:14px 0 16px;margin-bottom:12px}
.objectives h2{font-size:12.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.objectives ol{margin:0;padding-inline-start:20px;display:grid;gap:4px;font-size:16px;line-height:1.45;color:var(--muted)}
.objectives li::marker{color:var(--plum);font-weight:800}

/* ---------------- sections ---------------- */
.lsec{padding-top:44px;scroll-margin-top:16px}
.lsec + .lsec{margin-top:28px;border-top:1px solid var(--line)}
.lsec-eyebrow{font-family:var(--display);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--plum);margin-bottom:6px}
.lsec h2{font-size:clamp(26px,3.6vw,32px);line-height:1.18;letter-spacing:-.022em;font-weight:780;margin-bottom:16px}
.prose p{margin:0 0 16px}
.prose p:last-child{margin-bottom:0}
.prose ul{margin:0 0 16px;padding-inline-start:22px}
.prose li{margin:4px 0}
.prose li::marker{color:var(--plum)}
.prose .lead-on{font-family:var(--display);font-weight:700;font-size:18px;color:var(--plum-deep)}
.def{display:flex;gap:12px;align-items:flex-start;background:var(--plum-soft);border-radius:var(--r-md);padding:16px 18px;margin:0 0 16px;font-family:var(--display);font-size:18px;line-height:1.5;color:var(--plum-deep)}
.def .def-ico{flex:none;font-size:20px;line-height:1.3}
.def p{margin:0}
.big-idea{font-family:var(--display);font-size:clamp(21px,2.6vw,24px);line-height:1.35;font-weight:780;letter-spacing:-.015em;color:var(--ink);margin:6px 0 18px}

/* ---------------- microsim frame ---------------- */
.sim{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sim);padding:22px 22px 22px;margin:4px -22px 0;font-family:var(--display)}
.sim-title{position:relative;padding-inline-start:24px;font-size:22px;line-height:1.28;font-weight:780;letter-spacing:-.015em;margin-bottom:4px;color:var(--plum)}
.sim-title::before{content:"";position:absolute;inset-inline-start:2px;top:.42em;width:10px;height:10px;border-radius:999px;background:var(--plum);box-shadow:0 0 0 4px var(--plum-soft);transition:background .3s,box-shadow .3s}
.sim-desc{padding-inline-start:24px}
.sim-desc{font-size:16px;color:var(--muted);line-height:1.5;margin:0}
.sim-head{margin-bottom:18px}
.sim.is-done{border-color:color-mix(in srgb,var(--mint) 35%,var(--line))}
.sim.is-done .sim-title::before{background:var(--mint);box-shadow:0 0 0 4px var(--mint-soft)}

/* ---------------- debrief ---------------- */
.debrief{margin-top:30px}
.debrief-lock{display:flex;align-items:center;gap:10px;padding:13px 16px;border:1.5px dashed var(--line-strong);border-radius:var(--r-md);font-family:var(--display);font-size:15px;font-weight:600;color:var(--faint)}
.debrief-lock svg{flex:none}
.debrief-title{display:flex;align-items:center;gap:11px;font-size:24px;line-height:1.2;font-weight:800;letter-spacing:-.018em;color:var(--mint-deep);margin:0 0 14px}
.debrief-title .dt-ico{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--mint);color:#fff;box-shadow:0 0 0 5px var(--mint-soft)}
.debrief.opening .debrief-body{animation:rise .7s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------------- media + image slots ---------------- */
.media{margin:0;border-radius:var(--r-md);overflow:hidden;background:var(--rail)}
.media img{display:block;width:100%;height:100%;object-fit:cover}
.media.hero{aspect-ratio:16/9;margin-bottom:16px}
.media.portrait{aspect-ratio:4/3}
.media.hero.wide{aspect-ratio:2/1}
.ph{overflow:hidden}
.ph{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center;
  background:repeating-linear-gradient(-45deg,var(--plum-soft) 0 10px,#f7f4fc 10px 20px);border:1.5px dashed color-mix(in srgb,var(--plum) 38%,transparent)}
.ph-tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--plum);background:var(--panel);padding:3px 9px;border-radius:999px}
.ph-brief{font-family:var(--body);font-style:italic;font-size:14px;line-height:1.4;color:var(--plum-deep);max-width:34ch}

/* ---------------- feedback banners ---------------- */
.fb-slot:empty{display:none}
.fb-slot{margin-top:14px}
.fb{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-md);font-size:16.5px;line-height:1.5;font-weight:500;animation:fbIn .38s var(--spring) both}
@keyframes fbIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.fb-ico{flex:none;width:26px;height:26px;border-radius:999px;display:grid;place-items:center;font-size:14px;font-weight:900;margin-top:-1px}
.fb-body{flex:1;min-width:0}
.fb-body p{margin:0 0 6px}.fb-body p:last-child{margin:0}
.fb-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fb-btn{border:0;border-radius:999px;padding:7px 14px;font-weight:750;font-size:14.5px;cursor:pointer}
.fb.good{background:var(--mint-soft);color:var(--mint-deep)}
.fb.good .fb-ico{background:var(--mint);color:#fff}
.fb.try{background:var(--sun-soft);color:var(--sun-deep)}
.fb.try .fb-ico{background:var(--sun);color:#3d2900}
.fb.try .fb-btn{background:var(--sun-deep);color:#fff}
.fb.info{background:var(--plum-soft);color:var(--plum-deep)}
.fb.info .fb-ico{background:var(--plum);color:#fff}
.fb.info .fb-btn,.fb.good .fb-btn{background:var(--panel);color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.fb.bad{background:var(--coral-soft);color:var(--coral-deep)}
.fb.bad .fb-ico{background:var(--coral);color:#fff}

/* ---------------- question cards (MCQ0/1/2) ---------------- */
.qcard-label{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.qcard-setup{font-family:var(--body);font-size:18px;line-height:1.6;margin-bottom:12px}
.qcard-setup p{margin:0 0 10px}.qcard-setup p:last-child{margin:0}
.qcard-setup.quote{padding-inline-start:16px;border-inline-start:3px solid var(--line-strong)}
.qcard-q{font-size:19px;font-weight:780;line-height:1.35;letter-spacing:-.01em;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opts-row{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opts-col{grid-template-columns:1fr}
.opts-pics{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:10px;width:100%;text-align:start;background:var(--panel);border:1.5px solid var(--line-strong);border-radius:var(--r-md);padding:13px 15px;font-size:16.5px;font-weight:600;line-height:1.4;cursor:pointer;
  transition:border-color .15s,background .15s,transform .15s var(--spring),box-shadow .15s,opacity .25s}
.opt:hover:not(:disabled){border-color:var(--plum);background:var(--plum-soft);transform:translateY(-1px)}
.opt:active:not(:disabled){transform:translateY(0) scale(.99)}
.opt-row{display:flex;align-items:flex-start;gap:11px}
.opt-key{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--rail);color:var(--muted);font-size:13px;font-weight:800;margin-top:-1px;transition:background .15s,color .15s}
.opt:hover:not(:disabled) .opt-key{background:var(--plum);color:#fff}
.opt-text{flex:1;min-width:0}
.opts-row .opt{justify-content:center}
.opts-row .opt-row{justify-content:center;text-align:center}
.opts-pics .opt{padding:8px 8px 12px}
.opts-pics .opt-row{padding:0 4px}
.opt-media{aspect-ratio:16/10;border-radius:9px}
.opt-media.ph .ph-brief{font-size:12.5px}
.opt:disabled{cursor:default}
.opt.is-correct{border-color:var(--mint);background:var(--mint-soft);color:var(--mint-deep);box-shadow:0 0 0 3px color-mix(in srgb,var(--mint) 22%,transparent)}
.opt.is-correct .opt-key{background:var(--mint);color:#fff}
.opt.is-wrong{border-color:color-mix(in srgb,var(--sun) 70%,var(--line-strong));background:var(--sun-soft);color:var(--sun-deep);opacity:.75;animation:shake .36s}
.opt.is-wrong .opt-key{background:var(--sun);color:#3d2900}
.opt.is-dim{opacity:.45}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

/* ---------------- carousel (MCQ2 / MR) ---------------- */
.car{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;gap:6px;align-items:center}
.car-vp{overflow:hidden;overflow:clip;transition:height .38s var(--ease);touch-action:pan-y;min-width:0}
.car-track{display:flex;align-items:flex-start;transition:transform .5s var(--ease)}
.car-slide{flex:0 0 100%;min-width:0;padding:2px 3px 4px}
.car-arrow{width:36px;height:44px;padding:0;border:0;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:color .2s,transform .2s var(--spring),opacity .2s}
.car-arrow svg{stroke-width:2.8}
.car-arrow:hover:not(:disabled){color:var(--plum)}
.car-arrow:disabled{opacity:.22;cursor:not-allowed}
.car-arrow.ready{color:var(--plum);animation:nudgeR 1.3s ease-in-out infinite}
.car-arrow.ready:hover{animation:none;transform:translateX(3px)}
@keyframes nudgeR{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
[dir="rtl"] .car-arrow.ready{animation-name:nudgeL}
@keyframes nudgeL{0%,100%{transform:translateX(0)}50%{transform:translateX(-6px)}}
@keyframes ready{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--plum) 40%,transparent)}50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--plum) 0%,transparent)}}
[dir="rtl"] .car-arrow svg{transform:scaleX(-1)}
.car-foot{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
.car-dots{display:flex;gap:6px;align-items:center}
.car-dot{width:9px;height:9px;padding:0;border:0;border-radius:999px;background:var(--line-strong);cursor:pointer;transition:width .3s var(--ease),background .3s}
.car-dot.done{background:var(--mint)}
.car-dot.current{width:26px;background:var(--plum)}
.car-dot.current.done{background:var(--mint)}
.car-dot:disabled{cursor:not-allowed}
.car-count{font-size:13.5px;font-weight:750;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:center}
.car-foot .car-arrow{display:none}

/* ---------------- multi-select (MS) ---------------- */
.ms-list{display:grid;gap:8px}
.ms-item{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border:1.5px solid var(--line);border-radius:var(--r-md);cursor:pointer;font-size:16px;font-weight:600;line-height:1.4;transition:border-color .15s,background .15s}
.ms-item:hover{border-color:var(--plum)}
.ms-item input{position:absolute;opacity:0;pointer-events:none}
.ms-box{flex:none;color:#fff;width:22px;height:22px;border-radius:7px;border:2px solid var(--line-strong);display:grid;place-items:center;margin-top:0;transition:background .15s,border-color .15s,transform .2s var(--spring)}
.ms-box svg{opacity:0;transform:scale(.4);transition:opacity .15s,transform .2s var(--spring)}
.ms-item:has(input:checked){border-color:var(--plum);background:var(--plum-soft)}
.ms-item:has(input:checked) .ms-box{background:var(--plum);border-color:var(--plum)}
.ms-item:has(input:checked) .ms-box svg{opacity:1;transform:none}
.ms-item:has(input:focus-visible){outline:2.5px solid var(--plum);outline-offset:2px}
.ms-txt{flex:1;min-width:0}
.ms-sub{list-style:none;margin:8px 0 2px;padding:0;display:grid;gap:5px;font-size:15px;font-weight:550;color:var(--mint-deep);animation:rise .5s var(--ease) both}
.ms-sub li{position:relative;padding-inline-start:16px}
.ms-sub li::before{content:"";position:absolute;inset-inline-start:2px;top:.55em;width:6px;height:6px;border-radius:999px;background:var(--mint)}
.ms-note{margin:0 0 10px;font-size:16px;color:var(--mint-deep)}
.ms-list.locked .ms-item{cursor:default;border-color:color-mix(in srgb,var(--mint) 45%,var(--line));background:var(--mint-soft)}
.ms-list.locked .ms-box{background:var(--mint)!important;border-color:var(--mint)!important}
.sim-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px}
.sim-count{font-size:14.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;background:var(--plum);color:#fff;font-family:var(--display);font-size:16px;font-weight:750;cursor:pointer;transition:background .15s,transform .15s var(--spring),opacity .2s}
.btn:hover:not(:disabled){background:var(--plum-deep);transform:translateY(-1px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--plum-deep);box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.btn.ghost:hover:not(:disabled){background:var(--plum-soft)}

/* ---------------- multi-response cards (MR) ---------------- */
.mr-person{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center;margin-bottom:14px}
.mr-text{min-width:0}
.mr-person .media{aspect-ratio:16/9}
.mr-name{font-size:21px;font-weight:800;letter-spacing:-.015em;line-height:1.2}
.mr-age{font-weight:600;color:var(--muted)}
.mr-story{font-family:var(--body);font-size:17.5px;line-height:1.58;margin-top:6px}
.mr-ask{font-size:14px;font-weight:750;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:9px 15px 9px 12px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--panel);font-size:15.5px;font-weight:700;cursor:pointer;transition:border-color .15s,background .15s,transform .15s var(--spring)}
.chip:hover:not(:disabled){border-color:var(--plum)}
.chip[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#fff}
.chip.is-correct{background:var(--mint);border-color:var(--mint);color:#fff}
.chip.is-wrong{background:var(--sun-soft);border-color:var(--sun);color:var(--sun-deep);animation:shake .36s}
.chip:disabled{cursor:default}
.chip.is-dim{opacity:.4}

/* ---------------- open-ended (OEQ) ---------------- */
.oeq-prompt{font-family:var(--body);font-size:18px;line-height:1.6;margin:0 0 14px}
.oeq-field{position:relative}
.oeq textarea{width:100%;min-height:118px;resize:vertical;border:1.5px solid var(--line-strong);border-radius:var(--r-md);padding:14px 16px;background:var(--paper);font-family:var(--display);font-size:18px;font-weight:600;line-height:1.45;color:var(--ink);transition:border-color .15s,background .15s}
.oeq textarea::placeholder{color:var(--faint);font-weight:500}
.oeq textarea:focus{outline:none;border-color:var(--plum);background:var(--panel);box-shadow:0 0 0 4px var(--plum-soft)}
.goal-card{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:var(--r-md);background:linear-gradient(135deg,var(--plum) 0%,var(--plum-deep) 100%);color:#fff;animation:fbIn .5s var(--spring) both}
.goal-card .gc-ico{flex:none;font-size:28px;line-height:1}
.goal-card .gc-label{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;opacity:.75}
.goal-card .gc-text{font-size:19px;font-weight:700;line-height:1.4;margin-top:3px;overflow-wrap:anywhere}
.goal-card .gc-edit{margin-inline-start:auto;flex:none;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:750;cursor:pointer}
.goal-card .gc-edit:hover{background:rgba(255,255,255,.26)}

/* ---------------- sorter (S1) ---------------- */
.sorter-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bk{--bk:var(--plum);position:relative;display:flex;flex-direction:column;align-items:stretch;gap:6px;min-height:128px;padding:13px 13px 12px;text-align:start;border-radius:var(--r-md);border:1.5px solid color-mix(in srgb,var(--bk) 26%,transparent);background:color-mix(in srgb,var(--bk) 7%,var(--panel));cursor:default;transition:transform .2s var(--spring),border-color .2s,background .2s,box-shadow .2s}
.bk-head{display:flex;align-items:center;gap:8px}
.bk-emoji{font-size:22px;line-height:1}
.bk-name{font-size:16.5px;font-weight:800;letter-spacing:-.01em;line-height:1.2;color:color-mix(in srgb,var(--bk) 70%,var(--ink))}
.bk-count{margin-inline-start:auto;font-size:12.5px;font-weight:800;color:color-mix(in srgb,var(--bk) 75%,var(--ink));font-variant-numeric:tabular-nums}
.bk-desc{font-size:13.5px;font-weight:550;color:var(--muted);line-height:1.35}
.bk-items{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.bk-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px 5px 8px;border-radius:999px;background:var(--bk);color:#fff;font-size:13px;font-weight:700;line-height:1.25}
.sorter.armed .bk{cursor:pointer;border-style:dashed;border-color:color-mix(in srgb,var(--bk) 55%,transparent)}
.sorter.armed .bk:hover,.bk.over{transform:scale(1.02);border-style:solid;border-color:var(--bk);box-shadow:0 0 0 4px color-mix(in srgb,var(--bk) 16%,transparent);background:color-mix(in srgb,var(--bk) 12%,var(--panel))}
.bk.hit{animation:hit .55s var(--ease)}
@keyframes hit{30%{box-shadow:0 0 0 6px color-mix(in srgb,var(--mint) 35%,transparent);border-color:var(--mint)}}
.bk.miss{animation:shake .4s, missGlow .6s}
@keyframes missGlow{30%{border-color:var(--coral);box-shadow:0 0 0 5px var(--coral-soft)}}
.tray-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:16px 0 8px;font-size:14px;font-weight:700;color:var(--muted)}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:44px}
.card-chip{display:inline-flex;align-items:center;gap:8px;padding:10px 15px 10px 12px;border-radius:999px;background:var(--panel);border:1.5px solid var(--line-strong);font-size:15.5px;font-weight:700;line-height:1.25;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 1px 2px rgba(42,38,49,.06);transition:transform .18s var(--spring),box-shadow .18s,border-color .15s,opacity .2s}
.card-chip:hover{transform:translateY(-2px);box-shadow:0 6px 14px -6px rgba(69,48,143,.35)}
.card-chip.picked{border-color:var(--plum);background:var(--plum-soft);box-shadow:0 0 0 4px var(--plum-soft);transform:translateY(-2px)}
.card-chip.lifted{opacity:.3}
.card-chip .ce{font-size:18px;line-height:1}
.card-chip.ghost{position:fixed;z-index:80;pointer-events:none;margin:0;cursor:grabbing;transform:translate(-50%,-50%) rotate(-3deg) scale(1.05);box-shadow:0 14px 30px -8px rgba(69,48,143,.45);border-color:var(--plum)}
.card-chip.ghost.back{transition:left .32s var(--ease),top .32s var(--ease),transform .32s var(--ease),opacity .32s;transform:translate(-50%,-50%);opacity:.0}
.tray-done{font-size:15px;font-weight:700;color:var(--mint-deep)}

/* ---------------- budget game (G1) ---------------- */
.g-setup{font-family:var(--body);font-size:18px;line-height:1.6;margin:0 0 14px}
.bp{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:6;border:1.5px solid var(--line);border-radius:var(--r-md);padding:14px 15px 14px;background:var(--paper);box-shadow:0 10px 24px -18px rgba(42,38,49,.45);transition:border-color .3s}
.bp.is-over{border-color:color-mix(in srgb,var(--coral) 45%,var(--line))}
.bp-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 10px;margin-bottom:8px}
.bp-title{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bp-total{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;transition:color .3s}
.bp-total.over{color:var(--coral-deep)}
.bp-total small{font-size:14px;font-weight:700;color:var(--muted)}
.bp-bar{position:relative;height:46px;border-radius:11px;background:var(--line);margin:4px 0 28px}
.bp-segs{position:absolute;inset:0;display:flex}
.bp-seg{container-type:inline-size;position:relative;flex:none;height:100%;min-width:0;display:flex;align-items:center;justify-content:flex-start;gap:4px;padding:0 4px 0 8px;border:0;color:#fff;font-family:var(--display);font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;cursor:default;
  margin-inline-end:3px;transition:width .6s var(--ease),margin .6s var(--ease),border-radius .3s,opacity .35s,filter .35s,transform .2s var(--spring),box-shadow .2s}
.bp-seg.first{border-start-start-radius:11px;border-end-start-radius:11px}
.bp-seg.last{border-start-end-radius:6px;border-end-end-radius:6px;margin-inline-end:0}
.bp-seg.gone{margin-inline-end:0}
.bp-seg.s0{background:#5a7be0}.bp-seg.s1{background:#c2457a}.bp-seg.s2{background:#1f8a8a}.bp-seg.s3{background:#c27c0e}.bp-seg.s4{background:#6b4bc4}
.bp-seg .bs-e{font-size:15px}
.bp-seg .bs-p{font-variant-numeric:tabular-nums;opacity:.92}
@container (max-width:175px){.bp-seg .bs-l{display:none}}
@container (max-width:34px){.bp-seg .bs-p{display:none}}
.bp-seg.idle{opacity:.35;filter:saturate(.4)}
.bp-seg.active{box-shadow:inset 0 0 0 2.5px rgba(255,255,255,.9)}
.bp-keep:empty{display:none}
.bp-keep{margin-top:12px}
.kb-label{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:8px}
.kb-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.keep-card{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid var(--line-strong);border-radius:var(--r-md);background:var(--panel);text-align:start;cursor:pointer;transition:border-color .15s,background .15s,transform .15s var(--spring),box-shadow .15s}
.keep-card:hover,.keep-card:focus-visible{border-color:var(--plum);background:var(--plum-soft);transform:translateY(-1px)}
.keep-card .kc-sw{flex:none;width:42px;height:42px;border-radius:10px;font-size:20px;padding:0;margin:0;justify-content:center}
.kc-txt{display:flex;flex-direction:column;min-width:0}
.kc-name{font-size:16px;font-weight:800;line-height:1.25}
.kc-price{font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

.bp-seg.gone{padding:0;opacity:0}
.bp-mark{position:absolute;top:-7px;bottom:-7px;width:3px;margin-inline-start:-1.5px;background:var(--ink);border-radius:2px;z-index:2;pointer-events:none;transition:background .3s}
.bp-mark span{position:absolute;top:calc(100% + 4px);inset-inline-start:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:800;color:var(--ink);transition:color .3s}
[dir="rtl"] .bp-mark span{transform:translateX(50%)}
.bp.is-over .bp-mark{background:var(--coral)}
.bp.is-over .bp-mark span{color:var(--coral-deep)}
.bp-status{font-size:15px;font-weight:750;min-height:22px;font-variant-numeric:tabular-nums}
.bp-status.over{color:var(--coral-deep)}
.bp-status.exact{color:var(--mint-deep)}
.bp-status.left{color:var(--muted)}
.bp-dropped:empty{display:none}
.bp-dropped{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:6px;font-size:14px;font-weight:700;color:var(--muted)}
.bp-dropped .bd-item{padding:3px 10px;border-radius:999px;background:var(--rail);animation:fbIn .4s var(--spring) both}
.bp-dropped s{text-decoration-thickness:2px;text-decoration-color:var(--coral)}
.bp .fb-slot{margin-top:10px}
.bp .fb{padding:11px 13px;font-size:15.5px}
.g-twist{margin-top:18px}
.g-twist p{font-family:var(--body);font-size:18px;line-height:1.6;margin:0 0 14px}
.g-choice .g-price{display:inline-block;margin-top:2px;font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--plum-deep)}
.g-choice.is-picked{border-color:var(--plum);background:var(--plum-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--plum) 22%,transparent)}
.g-replay{margin-top:14px}

/* ---------------- slider game (G2) ---------------- */
.g2-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center;margin-bottom:16px}
.g2-top .media{aspect-ratio:16/9}
.g2-intro{font-family:var(--body);font-size:17.5px;line-height:1.58}
.g2-intro p{margin:0}
.meter{border-radius:var(--r-md);background:var(--paper);border:1.5px solid var(--line);padding:16px 16px 12px;margin-bottom:16px;position:relative}
.meter-num{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.meter-num b{font-size:clamp(30px,5vw,40px);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.meter-num span{font-size:15px;font-weight:700;color:var(--muted)}
.meter-bump{position:absolute;inset-inline-end:16px;top:14px;font-size:16px;font-weight:800;color:var(--mint);opacity:0;pointer-events:none}
.meter-bump.go{animation:bump .9s var(--ease)}
.meter-bump.down{color:var(--coral)}
@keyframes bump{0%{opacity:0;transform:translateY(6px)}20%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-16px)}}
.meter-track{position:relative;height:16px;border-radius:999px;background:var(--line);margin:16px 0 28px}
.meter-fill{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--plum) 70%,#fff),var(--plum));transition:width .6s var(--ease)}
[dir="rtl"] .meter-fill{background:linear-gradient(270deg,color-mix(in srgb,var(--plum) 70%,#fff),var(--plum))}
.meter.hit .meter-fill{background:var(--mint)}
.meter-target{position:absolute;top:-7px;bottom:-7px;width:3px;margin-inline-start:-1.5px;background:var(--ink);border-radius:2px}
.meter-target span{position:absolute;top:calc(100% + 4px);inset-inline-start:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:800}
[dir="rtl"] .meter-target span{transform:translateX(50%)}
.meter-ends{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--faint);margin-top:-22px;font-variant-numeric:tabular-nums}
.sliders{display:grid;gap:12px}
.sl{border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px 14px 10px;transition:border-color .2s}
.sl:focus-within{border-color:var(--plum)}
.sl-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sl-ico{font-size:20px;line-height:1}
.sl-name{font-size:16px;font-weight:800}
.sl-add{margin-inline-start:auto;font-size:13.5px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--rail);color:var(--muted);font-variant-numeric:tabular-nums;transition:background .2s,color .2s}
.sl-add.up{background:var(--mint-soft);color:var(--mint-deep)}
.sl-level{font-size:14.5px;font-weight:650;color:var(--plum-deep);margin:3px 0 4px}
.sl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;cursor:pointer;margin:0}
.sl input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:999px;background:linear-gradient(to right,var(--plum) var(--p,0%),var(--line) var(--p,0%))}
.sl input[type=range]::-moz-range-track{height:8px;border-radius:999px;background:var(--line)}
.sl input[type=range]::-moz-range-progress{height:8px;border-radius:999px;background:var(--plum)}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:999px;background:var(--panel);border:3px solid var(--plum);box-shadow:0 2px 6px rgba(69,48,143,.3);transition:transform .15s var(--spring)}
.sl input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:999px;background:var(--panel);border:3px solid var(--plum)}
.sl input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
.sl input[type=range]:focus-visible{outline:none}
[dir="rtl"] .sl input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(to left,var(--plum) var(--p,0%),var(--line) var(--p,0%))}
.sl-ticks{display:flex;justify-content:space-between;padding:0 6px;font-size:11.5px;font-weight:700;color:var(--faint)}
.challenge{display:flex;align-items:center;gap:12px;margin-top:16px;padding:12px 14px;border-radius:var(--r-md);background:var(--rail);font-size:16px;font-weight:700}
.challenge .ch-ico{font-size:22px}
.challenge.won{background:var(--mint-soft);color:var(--mint-deep)}

/* ---------------- toast + confetti ---------------- */
.toast{position:fixed;z-index:90;top:calc(16px + env(safe-area-inset-top,0px));left:50%;max-width:min(520px,calc(100% - 32px));transform:translate(-50%,-14px);opacity:0;display:flex;gap:10px;align-items:center;padding:12px 18px;border-radius:14px;background:var(--plum-deep);color:#fff;font-family:var(--display);font-size:16px;font-weight:700;line-height:1.35;box-shadow:0 16px 40px -12px rgba(42,38,49,.45);transition:opacity .25s,transform .3s var(--spring);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.good{background:var(--mint)}
.toast .te{font-size:20px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:85;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------------- lesson footer ---------------- */
.lesson-end{margin-top:56px;padding:22px;border-radius:var(--r-lg);background:var(--rail);font-family:var(--display);display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.lesson-end h3{font-size:20px;font-weight:800}
.lesson-end p{margin:2px 0 0;font-size:15px;color:var(--muted)}
.lesson-end.done{background:linear-gradient(135deg,var(--mint-soft),var(--plum-soft))}
.lesson-end a.btn{text-decoration:none}

/* ---------------- responsive ---------------- */
@media (max-width:960px){
  .app{display:block}
  .sb{position:fixed;inset-block:0;inset-inline-start:0;z-index:70;height:100%;width:min(310px,86vw);transform:translateX(-102%);transition:transform .32s var(--ease),box-shadow .32s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  [dir="rtl"] .sb{transform:translateX(102%)}
  .app.nav-open .sb{transform:none;box-shadow:0 0 40px rgba(42,38,49,.25)}
  .scrim{position:fixed;inset:0;z-index:65;background:rgba(42,38,49,.35);opacity:0;pointer-events:none;transition:opacity .3s}
  .app.nav-open .scrim{opacity:1;pointer-events:auto}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:60;padding:10px 16px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);font-family:var(--display)}
  .topbar b{font-size:16px;font-weight:800;letter-spacing:-.01em}
  .topbar .tb-sec{flex:1;min-width:0;font-size:14px;font-weight:650;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .menu-btn{flex:none;display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line-strong);background:var(--panel);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:750;cursor:pointer}
  .page{padding:24px 16px 64px}
  .sim{margin-inline:0;padding:18px 14px}
  .bp{top:calc(env(safe-area-inset-top,0px) + 68px)}
}
@media (max-width:640px){
  body{font-size:18px}
  .car{grid-template-columns:minmax(0,1fr)}
  .car > .car-arrow{display:none}
  .car-foot .car-arrow{display:grid}
  .car-foot{justify-content:space-between}

  .opts-pics{gap:8px}
  .opts-pics .opt{font-size:14.5px}
  .sorter-board{gap:8px}
  .bk{min-height:116px;padding:11px}
  .bk-desc{display:none}
  .keep-card{gap:9px;padding:9px 10px}
  .keep-card .kc-sw{width:34px;height:34px;font-size:17px}
  .kc-name{font-size:15px}
  .portrait.ph .ph-brief{display:none}
  .portrait.ph .ph-tag{white-space:normal;font-size:10px}
  .bk-name{font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ---------------- template gallery ---------------- */
.gallery code{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.86em;background:var(--rail);padding:1px 6px;border-radius:5px}
.tpl-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.tpl-head h2{margin:0}
.code-pill{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:14px;font-weight:700;padding:4px 11px;border-radius:8px;background:var(--plum);color:#fff}
.tpl-best{font-family:var(--display);font-size:16.5px;margin:0 0 8px}
.tpl-rules{font-family:var(--display);font-size:15px;line-height:1.5;color:var(--muted);margin:0 0 22px;padding-inline-start:20px;display:grid;gap:4px}
.tpl-rules li::marker{color:var(--plum)}
.tpl-config{margin-top:14px;font-family:var(--display)}
.tpl-config summary{cursor:pointer;font-size:14px;font-weight:750;color:var(--plum-deep);padding:6px 0}
.tpl-config pre,.snippet{margin:8px 0 0;max-height:420px;overflow:auto;background:#221d2b;color:#ece6f7;border-radius:var(--r-md);padding:16px;font-size:13px;line-height:1.55}
.tpl-config pre code,.snippet code{background:none;padding:0;color:inherit;font-size:inherit}
.anatomy{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:a;font-family:var(--display)}
.anatomy li{counter-increment:a;display:grid;grid-template-columns:34px minmax(0,1fr);gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.anatomy li::before{content:counter(a);grid-row:span 2;width:28px;height:28px;border-radius:999px;background:var(--plum-soft);color:var(--plum-deep);display:grid;place-items:center;font-weight:800;font-size:14px}
.anatomy strong{font-size:17px}
.anatomy span{font-size:15.5px;color:var(--muted);line-height:1.5}
.fb-demo{display:grid;gap:10px;font-family:var(--display)}
.table-wrap{overflow-x:auto;margin:6px 0 14px}
table.evt{border-collapse:collapse;width:100%;font-family:var(--display);font-size:15px}
table.evt th{text-align:start;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:8px 10px;border-bottom:1.5px solid var(--line-strong)}
table.evt td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.mr-ask:empty{display:none}
.debrief-body p:not(.big-idea):not(.lead-on),.debrief-body li,.debrief-body .def p{text-align:justify;hyphens:auto;-webkit-hyphens:auto}

/* MR answer options: same family as single-choice options, with a checkbox */
.mr-opts{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mr-opt{padding:11px 12px}
.mr-opt .opt-row{align-items:center;gap:9px}
.mr-opt .ms-box{width:20px;height:20px;border-radius:6px;color:#fff}
.mr-opt[aria-pressed="true"]{border-color:var(--plum);background:var(--plum-soft)}
.mr-opt[aria-pressed="true"] .ms-box{background:var(--plum);border-color:var(--plum)}
.mr-opt[aria-pressed="true"] .ms-box svg{opacity:1;transform:none}
.mr-opt.is-correct .ms-box{background:var(--mint);border-color:var(--mint)}
.mr-opt.is-correct .ms-box svg{opacity:1;transform:none}
.mr-opt.is-wrong{opacity:1}
.mr-opt.is-wrong .ms-box{background:var(--sun);border-color:var(--sun)}
.mr-opt.is-wrong .ms-box svg{opacity:1;transform:none}

/* G2 level board */
.g2-board{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr)) minmax(0,1.15fr);gap:10px;padding:14px 12px 12px;border:1.5px solid var(--line);border-radius:var(--r-md);background:var(--paper)}
.g2-col{display:flex;flex-direction:column;align-items:stretch;gap:8px;text-align:center;min-width:0}
.g2-head{height:46px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px}
.g2-ico{font-size:20px;line-height:1}
.g2-name{font-size:13.5px;font-weight:800;line-height:1.15}
.g2-foot{min-height:40px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:0}
.g2-add{font-size:14px;font-weight:800;color:var(--faint);font-variant-numeric:tabular-nums;transition:color .2s}
.g2-add.up{color:var(--mint-deep)}
.g2-meter{position:relative;padding-inline-start:10px;border-inline-start:1.5px dashed var(--line-strong)}
.g2-vtrack{position:relative;height:184px;border-radius:12px;background:var(--line)}
.g2-fill{position:absolute;inset-inline:0;bottom:0;border-radius:12px;background:linear-gradient(0deg,#b8efcd 0%,#4cc983 45%,#0b6b3a 100%) bottom/100% var(--track-h,184px) no-repeat;transition:height .6s var(--ease)}
.g2-target{position:absolute;inset-inline:-5px;height:3px;margin-bottom:-1.5px;background:var(--ink);border-radius:2px;z-index:1}
.g2-target span{position:absolute;bottom:5px;inset-inline-start:50%;transform:translateX(-50%);white-space:nowrap;font-size:11.5px;font-weight:800;color:var(--ink)}
[dir="rtl"] .g2-target span{transform:translateX(50%)}
.g2-total{font-size:20px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.g2-unit{font-size:11.5px;font-weight:700;color:var(--muted)}
.g2-bump{top:auto;bottom:44px;inset-inline-end:4px}
@media (max-width:640px){
  .mr-opts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mr-opt{padding:10px 8px;font-size:14.5px}
  .mr-opt .opt-row{gap:6px}
  .mr-opt .ms-box{width:18px;height:18px}
  .mr-person{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px}
  .mr-story{font-size:16px}
  .g2-top{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px}
  .g2-intro{font-size:16px}
  .g2-board{gap:6px;padding:12px 8px 10px}
  .g2-name{font-size:10.5px}
  .g2-ico{font-size:17px}
    .g2-add{font-size:11.5px}
  .g2-total{font-size:15px}
  .g2-unit{font-size:10px}
  .g2-meter{padding-inline-start:6px}
}

/* vertical sliders: slim rail, small handle, a legend label beside every stop */
.vs{position:relative;height:184px;display:flex;align-items:stretch;gap:6px;cursor:pointer;touch-action:none;outline:none}
.vs-railwrap{flex:none;width:20px;display:flex;justify-content:center}
.vs-rail{position:relative;width:4px;height:calc(100% - 32px);margin:16px 0;border-radius:999px;background:var(--line-strong)}
.vs-fill{position:absolute;inset-inline:0;bottom:0;border-radius:999px;background:var(--plum);transition:height .3s var(--ease)}
.vs-tick{position:absolute;inset-inline-start:50%;width:8px;height:8px;margin:0 0 -4px -4px;border-radius:999px;background:var(--panel);border:1.5px solid var(--line-strong);transition:border-color .2s,background .2s}
[dir="rtl"] .vs-tick{margin:0 -4px -4px 0}
.vs-tick.on{border-color:var(--plum);background:var(--plum)}
.vs-thumb{position:absolute;inset-inline-start:50%;width:16px;height:16px;margin:0 0 -8px -8px;border-radius:999px;background:var(--panel);border:2.5px solid var(--plum);box-shadow:0 1px 4px rgba(69,48,143,.35);transition:bottom .3s var(--ease),transform .15s var(--spring);z-index:1}
[dir="rtl"] .vs-thumb{margin:0 -8px -8px 0}
.vs:hover .vs-thumb,.vs.active .vs-thumb{transform:scale(1.15)}
.vs:focus-visible .vs-thumb{box-shadow:0 0 0 4px var(--plum-soft),0 1px 4px rgba(69,48,143,.35)}
.vs.active .vs-fill,.vs.active .vs-thumb{transition:none}
.vs-legend{position:relative;flex:1;min-width:0;margin:16px 0}
.vs-lab{position:absolute;inset-inline-start:0;inset-inline-end:0;transform:translateY(50%);text-align:start;font-size:11.5px;font-weight:650;line-height:1.15;color:var(--faint);transition:color .2s}
.vs-lab.cur{color:var(--plum-deep);font-weight:800}
.g2-col{align-items:stretch}
.g2-board .g2-head{align-items:flex-start;text-align:start;padding-inline-start:4px}
.g2-board .g2-meter .g2-head{align-items:center;text-align:center;padding:0}
.g2-board .g2-foot{align-items:flex-start;padding-inline-start:4px}
.g2-board .g2-meter .g2-foot{align-items:center;padding:0}
/* MR correct state wins over the selected (purple) state */
.mr-opt.is-correct[aria-pressed]{border-color:var(--mint);background:var(--mint-soft);color:var(--mint-deep);box-shadow:0 0 0 3px color-mix(in srgb,var(--mint) 20%,transparent)}
.mr-opt.is-dim[aria-pressed]{background:var(--panel);border-color:var(--line-strong)}
/* person / intro: text above the image */
.mr-person,.g2-top{grid-template-columns:minmax(0,1fr)!important;gap:10px!important;align-items:start}
.mr-person .media,.g2-top .media{aspect-ratio:16/9;width:100%}
@media (max-width:640px){
  .g2-board{grid-template-columns:repeat(2,minmax(0,1fr)) minmax(0,.62fr);grid-auto-flow:row;row-gap:14px}
  .g2-board .g2-meter{grid-column:3;grid-row:1 / span 2}
  .g2-board .g2-meter .g2-vtrack{height:auto;flex:1}
  .vs{height:128px}
  .g2-name{font-size:12.5px}
  .vs-lab{font-size:11px}
  .g2-foot{min-height:22px}
  .g2-add{font-size:12.5px}
  .g2-total{font-size:16px}
}
.g2-target span{background:var(--panel);padding:1px 7px;border-radius:999px;box-shadow:0 1px 3px rgba(42,38,49,.18)}
.var{margin-top:34px;padding-top:26px;border-top:1px dashed var(--line-strong)}
.var-name{font-size:22px;font-weight:780;letter-spacing:-.015em;margin:0}
.fam-shared{background:var(--rail);border-radius:var(--r-md);padding:12px 16px 4px;margin:6px 0 4px}
.fam-shared .fs-label{font-family:var(--display);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fam-shared .tpl-rules{margin-bottom:8px}
.fam-sub{font-size:13px;color:var(--muted)}
table.evt td[rowspan]{background:var(--rail);border-inline-end:1px solid var(--line)}
table.evt td code{white-space:nowrap}
.sb-brand{padding-bottom:6px}
.sb-roadmap{margin:0 2px 8px;padding:12px 12px 13px;border-radius:12px;background:var(--panel);box-shadow:0 1px 2px rgba(42,38,49,.06)}
.sb-roadmap .rm-title{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.15;color:var(--plum)}
.sb-roadmap .rm-sub{font-family:var(--display);font-size:13.5px;font-weight:650;color:var(--muted);margin-top:2px}

/* find-both prompt */
.fb .fb-more{margin-top:6px;font-weight:750;color:var(--plum-deep)}
/* lesson intro */
.lesson-intro{margin:6px 0 4px;font-size:19px}
.lesson-intro p{margin:0 0 10px}
/* several microsims in one section */
.lsec .sim + .sim{margin-top:28px}
/* FLIP & reveal */
.flip-stage{perspective:1600px}
.flip-inner{display:grid;transform-style:preserve-3d;transition:transform .75s var(--ease)}
.flip-face{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--panel);padding:14px 14px 16px;display:flex;flex-direction:column;gap:12px}
.flip-back{transform:rotateY(180deg);background:var(--plum-soft);border-color:color-mix(in srgb,var(--plum) 30%,transparent)}
.flipcard.is-flipped .flip-inner{transform:rotateY(180deg)}
.flip-face .media.hero{margin:0}
.flip-tag{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--display);font-size:12.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.flip-back .flip-tag{color:var(--plum-deep)}
.flip-badge{order:2;font-size:15px;letter-spacing:0;text-transform:none;font-weight:800;color:var(--ink);background:var(--sun-soft);border:1.5px solid color-mix(in srgb,var(--sun) 60%,transparent);padding:3px 11px;border-radius:999px;font-variant-numeric:tabular-nums}
.flip-text{font-family:var(--body);font-size:18px;line-height:1.55}
.flip-text p{margin:0}
.flip-bar{justify-content:center}
.flip-btn svg{flex:none}

/* ================= v1.4 · Lesson 4 components ================= */
/* Outcome feedback: no right or wrong, it reflects the learner's own choice */
.fb.outcome{background:var(--plum-soft);color:var(--plum-deep);border-inline-start:4px solid var(--plum)}
.fb.outcome .fb-ico{background:var(--plum);color:#fff;font-size:10px}
.fb.outcome strong{color:var(--plum-deep)}
.opt.is-sel{border-color:var(--plum);background:var(--plum-soft);color:var(--plum-deep);box-shadow:0 0 0 3px color-mix(in srgb,var(--plum) 18%,transparent);opacity:1}
.btn.ghost.is-sel{background:var(--plum-soft);box-shadow:inset 0 0 0 2px var(--plum);opacity:1}
.btn.is-dim{opacity:.45}

/* Money Bar */
.mbar{margin-top:12px;padding:14px 16px;border-radius:var(--r-md);background:var(--rail);display:grid;gap:9px;font-family:var(--display)}
.mb-row{display:grid;grid-template-columns:minmax(78px,max-content) 1fr minmax(48px,max-content);align-items:center;gap:12px;font-size:14.5px}
.mb-lab{color:var(--muted);font-weight:750}
.mb-track{height:14px;border-radius:999px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line-strong);overflow:hidden}
.mb-fill{display:block;height:100%;width:0;border-radius:inherit;transition:width .9s var(--ease)}
.mb-a .mb-fill{background:color-mix(in srgb,var(--plum) 38%,var(--line-strong))}
.mb-saved .mb-b .mb-fill,.mb-plan .mb-b .mb-fill{background:var(--mint)}
.mb-extra .mb-b .mb-fill{background:var(--coral)}
.mb-val{text-align:end;font-variant-numeric:tabular-nums;font-weight:800}
.mb-verdict{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15.5px;padding-top:2px}
.mb-dot{flex:none;width:12px;height:12px;border-radius:999px}
.mb-saved .mb-verdict,.mb-plan .mb-verdict{color:var(--mint-deep)}.mb-saved .mb-dot,.mb-plan .mb-dot{background:var(--mint)}
.mb-extra .mb-verdict{color:var(--coral-deep)}.mb-extra .mb-dot{background:var(--coral)}

/* G5 receipt game */
.rc-formula{font-size:15px;line-height:1.5;background:var(--rail);border-radius:var(--r-md);padding:10px 14px;margin-bottom:14px}
.rc-prog{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-bottom:22px}
.rc-prog i{height:6px;border-radius:999px;background:var(--line);transition:background .3s}
.rc-prog i.cur{background:var(--plum)}.rc-prog i.done{background:var(--mint)}
.rc{position:relative;background:#fffdf9;border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:20px 18px 18px;margin-bottom:12px;box-shadow:0 10px 26px -20px rgba(69,48,143,.45)}
.rc::after{content:"";position:absolute;inset-inline:0;bottom:-10px;height:10px;background:linear-gradient(135deg,#fffdf9 33%,transparent 0) 0 0/14px 10px repeat-x,linear-gradient(225deg,#fffdf9 33%,transparent 0) 0 0/14px 10px repeat-x}
.rc-sticker{position:absolute;top:-13px;inset-inline-end:16px;transform:rotate(-5deg);background:#c0281b;color:#fff;font-weight:850;font-size:14px;letter-spacing:.02em;padding:6px 12px;border-radius:8px;box-shadow:0 3px 0 #7d150c}
.rc-head{display:flex;align-items:center;gap:10px;padding-inline-end:90px}
.rc-emoji{font-size:30px;line-height:1}
.rc-name{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.rc-story{font-family:var(--body);font-size:17px;line-height:1.55;margin:8px 0 12px}
.rc-story p{margin:0}
.rc-tear{border-top:2px dashed var(--line-strong);margin:0 0 6px}
.rc-line{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:10px 8px;border-radius:10px;font-size:16px;transition:background .2s}
.rc-line + .rc-line,.rc-pending .rc-line{border-top:1px solid var(--line);border-radius:0}
.rc-line.is-active{background:var(--plum-soft);border-radius:10px}
.rc-line.is-in{animation:fbIn .35s var(--spring) both}
.rc-lab{font-weight:720;display:inline-flex;align-items:center;gap:8px}
.rc-auto{font-size:11px;font-weight:850;color:var(--mint-deep);background:var(--mint-soft);padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em}
.rc-val,.rc-expr,.rc-res{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.rc-val{justify-content:flex-end;font-variant-numeric:tabular-nums;font-weight:780;margin-inline-start:auto}
.rc-op{color:var(--plum);font-weight:850}
.rc-cur{color:var(--muted);font-size:12.5px;font-weight:750}
.rc-frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;gap:3px}
.rc-top{padding-bottom:3px;border-bottom:2px solid var(--ink)}
.rc-bot{font-size:15px}
.rc-box{min-width:58px;height:36px;padding:0 8px;display:inline-grid;place-items:center;border:2px dashed var(--line-strong);border-radius:9px;background:#fff;font-weight:850;font-variant-numeric:tabular-nums}
.rc-box.is-live{border-color:var(--plum);color:var(--plum-deep);box-shadow:0 0 0 3px color-mix(in srgb,var(--plum) 18%,transparent)}
.rc-box.is-ok{border:2px solid var(--mint);background:var(--mint-soft);color:var(--mint-deep)}
.rc-box.is-shown{border:2px solid var(--sun);background:var(--sun-soft);color:var(--sun-deep)}
.rc-box.shake{animation:shake .36s}
.rc-total .rc-lab{font-size:17px}
.rc-note{flex-basis:100%}.rc-note:empty{display:none}
.rc-note p{margin:2px 0 0;font-size:14.5px;color:var(--sun-deep);font-weight:600}
.rc-stamp{position:absolute;inset-inline-end:10px;transform:translateY(-120%) rotate(-6deg);border:2px solid var(--mint);color:var(--mint-deep);font-size:11.5px;font-weight:900;padding:2px 8px;border-radius:6px;letter-spacing:.06em;background:#fffdf9}
.rc-line{position:relative}
.rc-ghost{opacity:.55}.rc-dots{letter-spacing:.2em;color:var(--faint)}
.kp{position:relative;margin:4px auto 10px;padding:14px;max-width:340px;border:2px solid var(--plum);border-radius:14px;background:#fff;box-shadow:0 14px 30px -18px rgba(69,48,143,.55);animation:fbIn .3s var(--spring) both}
.kp::before{content:"";position:absolute;top:-9px;inset-inline-end:44px;width:14px;height:14px;background:#fff;border-top:2px solid var(--plum);border-inline-start:2px solid var(--plum);transform:rotate(45deg)}
.kp-prompt{margin:0 0 6px;font-weight:780;font-size:15.5px;line-height:1.35}
.kp-note:empty{display:none}
.kp-note .fb{padding:10px 12px;font-size:15px;margin:6px 0 2px}
.kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kp-key{height:46px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--panel);font-family:var(--display);font-size:19px;font-weight:750;cursor:pointer;box-shadow:0 2px 0 var(--line-strong);transition:transform .1s,background .15s}
.kp-key:hover{background:var(--plum-soft);border-color:var(--plum)}
.kp-key:active{transform:translateY(2px);box-shadow:none}
.kp-minus{color:var(--coral-deep);font-size:24px}
.kp-check{width:100%}
.rc-after{margin-top:6px}
.rc-after:empty{display:none}
.rc-sum{padding:4px 0}
.rc-sum-title{margin:0 0 12px;font-size:19px;font-weight:800}
.rc-sum-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rc-sum-list li{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-radius:10px;background:var(--rail);border-inline-start:5px solid var(--mint);font-weight:720}
.rc-sum-list li.minus{border-color:var(--coral)}
.rc-sum-list li b{font-variant-numeric:tabular-nums}
.rc-sum-list li.plus b{color:var(--mint-deep)}.rc-sum-list li.minus b{color:var(--coral-deep)}
.rc-sum-line{font-family:var(--body);font-size:17px;margin:14px 0 0}

/* G4 price vs value */
.pv-wallet{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px 14px;background:var(--rail);border-radius:var(--r-md);font-size:15px;font-weight:650}
.pv-wallet b{font-variant-numeric:tabular-nums}
.pv-intro{font-family:var(--body);font-size:17.5px;line-height:1.55;margin-top:12px}
.pv-intro p{margin:0 0 8px}.pv-intro p:last-child{margin:0}
.pv-step{display:flex;align-items:center;gap:10px;font-weight:780;font-size:17.5px;line-height:1.35;margin:22px 0 12px}
.pv-n{flex:none;width:26px;height:26px;border-radius:999px;background:var(--plum);color:#fff;display:grid;place-items:center;font-size:13.5px;font-weight:850}
.pv-gifts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pv-gift{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px 14px;border:1.5px solid var(--line-strong);border-radius:var(--r-md);background:var(--panel);cursor:pointer;font-family:var(--display);font-weight:750;font-size:16px;transition:border-color .15s,background .15s,transform .15s var(--spring)}
.pv-gift:hover:not(:disabled){border-color:var(--plum);background:var(--plum-soft);transform:translateY(-1px)}
.pv-gift.is-picked{border-color:var(--plum);background:var(--plum-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--plum) 18%,transparent)}
.pv-gift:disabled{cursor:default}
.pv-gift:disabled:not(.is-picked){opacity:.5}
.pv-gift-emoji{font-size:34px;line-height:1.1}
.pv-gift-done{display:none;position:absolute;top:7px;inset-inline-end:7px;width:21px;height:21px;border-radius:999px;background:var(--mint);color:#fff;place-items:center}
.pv-gift.is-done .pv-gift-done{display:grid}
.pv-chips .chip:disabled:not([aria-pressed="true"]){opacity:.45}
.pv-count{color:var(--muted);font-size:14.5px;font-weight:700}
.pv-slider{padding:16px;border:1px solid var(--line);border-radius:var(--r-md);background:#fff}
.pv-price{display:block;text-align:center;font-size:30px;font-weight:850;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pv-range{-webkit-appearance:none;appearance:none;display:block;width:100%;height:14px;margin:16px 0 8px;border-radius:999px;cursor:pointer;
  background:linear-gradient(to right,var(--mint) 0 min(var(--pos,0%),var(--save)),var(--mint-soft) 0 var(--save),var(--coral) 0 max(var(--pos,0%),var(--save)),var(--coral-soft) 0)}
.pv-range::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:999px;background:#fff;border:3px solid var(--plum);box-shadow:0 3px 10px -3px rgba(69,48,143,.6)}
.pv-range::-moz-range-thumb{width:26px;height:26px;border-radius:999px;background:#fff;border:3px solid var(--plum)}
.pv-range:disabled{cursor:default;opacity:.8}
.pv-scale{display:flex;font-size:12px;font-weight:750;color:var(--mint-deep)}
.pv-z1{width:var(--save);border-inline-end:2px solid var(--line-strong);padding-inline-end:6px}
.pv-z2{flex:1;text-align:end;color:var(--coral-deep)}
.pv-live{margin:10px 0 0;text-align:center;font-size:15px;font-weight:650}
.pv-live.over{color:var(--coral-deep)}
.pv-warn:empty{display:none}.pv-warn{margin-top:10px}

@keyframes rcPulse{0%{transform:none;box-shadow:0 0 0 0 color-mix(in srgb,var(--mint) 55%,transparent)}35%{transform:scale(1.14);box-shadow:0 0 0 7px color-mix(in srgb,var(--mint) 30%,transparent)}100%{transform:none;box-shadow:0 0 0 0 transparent}}
@media (max-width:640px){.rc-game .kp{margin-inline:auto 0;max-width:100%}.rc-verdict{font-size:16px}}
@media (prefers-reduced-motion:reduce){.rc-pop,.rc-pulse{animation:none}.rc-wait{opacity:1}}
.rc-bbar .bp-seg{padding:0;overflow:hidden;white-space:nowrap}
.rc-bbar .bp-seg .bs-p{padding:0 10px;color:#fff;font-weight:800}
/* v1.5 · receipt game: vertical planned-vs-spent chart beside the receipt, colour-coded boxes, drag-to-answer savings */
.rc-game{--c-plan:#3b6fd8;--c-plan-soft:#e3ebfb;--c-plan-deep:#1f449c;--c-disc:#c0281b;--c-disc-soft:#fde3e0;--c-disc-deep:#8f1d13;--c-spent:#ec7a1c;--c-spent-soft:#fde8d6;--c-spent-deep:#8a3f06}
.rc-bp{display:none}
.rc-layout{display:grid;grid-template-columns:minmax(0,1fr) 168px;gap:16px;align-items:start}
.rc-layout.is-summary{grid-template-columns:1fr}.rc-layout.is-summary .rc-vp{display:none}
.rc-vp{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:5;padding:12px 12px 12px;border:1.5px solid var(--line);border-radius:var(--r-md);background:var(--paper);box-shadow:0 10px 24px -18px rgba(42,38,49,.45);transition:border-color .3s}
.rc-vp.is-over{border-color:color-mix(in srgb,var(--coral) 50%,var(--line))}
.rc-vp.is-saved{border-color:color-mix(in srgb,var(--mint) 50%,var(--line))}
.rc-vp.is-live{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 10%,transparent)}
.rc-vp-title{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rc-chart{position:relative;height:250px;margin:26px 4px 0;display:grid;grid-template-columns:1fr 1fr;gap:14px;border-bottom:2px solid var(--line-strong);outline-offset:6px}
.rc-vp.is-live .rc-chart{cursor:ns-resize;touch-action:none}
.rc-col{position:relative;height:100%}
.rc-fill{position:absolute;inset-inline:0;bottom:0;height:0;border-radius:8px 8px 0 0;transition:height .8s var(--ease)}
.rc-col.c-plan .rc-fill{background:var(--c-plan)}
.rc-col.c-spent .rc-fill{background:var(--c-spent)}
.rc-colval{position:absolute;inset-inline-start:50%;transform:translateX(-50%);font-size:13px;font-weight:850;font-variant-numeric:tabular-nums;white-space:nowrap;transition:bottom .8s var(--ease)}
[dir=rtl] .rc-colval{transform:translateX(50%)}
.c-plan .rc-colval{color:var(--c-plan-deep)}.c-spent .rc-colval{color:var(--c-spent-deep)}
.rc-ghost{position:absolute;inset-inline:0;bottom:0;height:0;display:grid;place-items:center;border:2px dashed var(--mint);border-bottom:0;border-radius:8px 8px 0 0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--mint) 35%,transparent) 0 4px,transparent 4px 9px);transition:height .8s var(--ease) .3s,bottom .8s var(--ease)}
.rc-ghost:not([style*="height: 0"]){}
.rc-ghost span{font-size:11.5px;font-weight:850;color:var(--mint-deep);background:#fff;border-radius:999px;padding:1px 6px;white-space:nowrap}
.rc-ghost span:empty{display:none}
.c-spent .rc-colval{z-index:1}
.rc-pline{position:absolute;inset-inline:-4px;height:0;border-top:2.5px dashed var(--c-plan);z-index:2;transition:bottom .8s var(--ease)}
.rc-gap{position:absolute;inset-inline:-4px;z-index:2;display:grid;place-items:center;pointer-events:none}
.rc-gap.is-saved{background:color-mix(in srgb,var(--mint) 22%,transparent);border-inline-start:4px solid var(--mint)}
.rc-gap.is-over{background:color-mix(in srgb,var(--coral) 22%,transparent);border-inline-start:4px solid var(--coral)}
.rc-gap span{font-size:13px;font-weight:900;padding:2px 8px;border-radius:999px;background:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.rc-gap.is-saved span{color:var(--mint-deep)}.rc-gap.is-over span{color:var(--coral-deep)}
.rc-drag{position:absolute;inset-inline:-8px;height:0;border-top:3px solid var(--ink);z-index:3;pointer-events:none}
.rc-knob{position:absolute;inset-inline-end:-6px;top:0;width:24px;height:24px;border-radius:999px;background:#fff;border:3px solid var(--ink);transform:translateY(-50%);box-shadow:0 3px 10px -3px rgba(42,38,49,.6)}
.rc-vp.is-live .rc-knob{animation:rcNudge 1.6s ease-in-out infinite}
@keyframes rcNudge{0%,100%{transform:translateY(-50%)}50%{transform:translateY(calc(-50% - 6px))}}
.rc-collabs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 4px 0;text-align:center;font-size:12.5px;font-weight:800}
.rc-collabs .c-plan{color:var(--c-plan-deep)}.rc-collabs .c-spent{color:var(--c-spent-deep)}
.rc-key{margin-top:8px;font-size:11.5px;font-weight:700;color:var(--muted)}
.rc-key span{display:inline-flex;align-items:center;gap:5px}
.rc-key i{width:12px;height:10px;border:1.5px dashed var(--mint);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--mint) 45%,transparent) 0 2px,transparent 2px 4px);border-radius:2px}
.rc-verdict{margin-top:8px;font-size:14.5px;font-weight:850;line-height:1.3}
.rc-verdict:empty{display:none}
.rc-verdict.good{color:var(--mint-deep)}.rc-verdict.bad{color:var(--coral-deep)}
/* colour-coded boxes: planned blue, % off red (like the sticker), saving green, spent orange */
.rc-box.is-ok[data-c=plan],.rc-resbox[data-c=plan]{border:2px solid var(--c-plan);background:var(--c-plan-soft);color:var(--c-plan-deep)}
.rc-box.is-ok[data-c=disc]{border:2px solid var(--c-disc);background:var(--c-disc-soft);color:var(--c-disc-deep)}
.rc-box.is-ok[data-c=save],.rc-resbox[data-c=save]{border:2px solid var(--mint);background:var(--mint-soft);color:var(--mint-deep)}
.rc-resbox[data-c=spent]{border:2px solid var(--c-spent);background:var(--c-spent-soft);color:var(--c-spent-deep)}
.rc-resbox[data-c=plain]{border:2px solid var(--line-strong);background:var(--rail);color:var(--ink)}
.rc-box.is-ok[data-c=over]{border:2px solid var(--coral);background:var(--coral-soft);color:var(--coral-deep)}
.rc-box.is-live[data-c=save]{border-color:var(--ink)}
.rc-dragpad{max-width:360px}
.rc-dragpad .kp-prompt{font-weight:700}
@media (max-width:760px){
  .rc-layout{grid-template-columns:1fr}
  .rc-vp{order:-1;top:calc(env(safe-area-inset-top,0px) + 68px);padding:10px 12px}
  .rc-chart{height:118px;margin-top:22px;max-width:260px;margin-inline:auto}
  .rc-collabs{max-width:260px;margin-inline:auto}
  .rc-key,.rc-verdict{text-align:center;margin-top:5px}
}
.rc-vp.no-disc .rc-key{display:none}
/* the savings gap sits on the Spent column only, so the blue and orange stay true */
.rc-gap{inset-inline:calc(50% + 7px) -4px;border-inline-start:0!important;border-top:2.5px solid;border-bottom:2.5px solid}
.rc-gap.is-saved{background:repeating-linear-gradient(0deg,color-mix(in srgb,var(--mint) 16%,transparent) 0 6px,transparent 6px 10px);border-color:var(--mint)}
.rc-gap.is-over{background:repeating-linear-gradient(0deg,color-mix(in srgb,var(--coral) 16%,transparent) 0 6px,transparent 6px 10px);border-color:var(--coral)}
.rc-gap span{box-shadow:0 2px 6px -2px rgba(42,38,49,.35)}
/* v1.5.1 */
.rc-pline{display:none}
.rc-box:empty::after{content:"\00a0"}
.rc-box.rc-empty{border:2px dashed var(--line-strong);background:#fff}
.rc-chip{padding:1px 7px;border-radius:7px;border:1.5px solid transparent}
.rc-chip[data-c=plan]{background:var(--c-plan-soft);border-color:var(--c-plan);color:var(--c-plan-deep)}
.rc-chip[data-c=save]{background:var(--mint-soft);border-color:var(--mint);color:var(--mint-deep)}
.rc-chip[data-c=spent]{background:var(--c-spent-soft);border-color:var(--c-spent);color:var(--c-spent-deep)}
.rc-chip[data-c=disc]{background:var(--c-disc-soft);border-color:var(--c-disc);color:var(--c-disc-deep)}
.rc-pop{animation-duration:.6s}
.rc-fill{transition:height 1.1s var(--ease)}
.rc-ghost{transition:height .9s var(--ease),bottom .9s var(--ease)}
.rc-ghost span{color:var(--mint-deep)}
.rc-key i{border-style:dashed}
.rc-ghost{transition:height .9s var(--ease),bottom .9s var(--ease),opacity .4s}
.rc-ghost.off{opacity:0}
.rc-vp:not(.has-disc) .rc-key{display:none}
/* v1.6 · simple receipts */
.rc-tag{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:10px 8px;font-size:16px}
.rc-tagval{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-variant-numeric:tabular-nums}
.rc-tagval s{color:var(--muted);text-decoration-thickness:2px;text-decoration-color:var(--c-disc)}
.rc-arrow{color:var(--muted)}
.rc-q{padding:12px 8px 6px;border-top:1px solid var(--line);animation:fbIn .4s var(--spring) both}
.rc-qtext{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-weight:780;font-size:16.5px;line-height:1.35}
.rc-choices{display:flex;flex-wrap:wrap;gap:10px}
.rc-choice{font-size:16.5px;padding:10px 20px;font-variant-numeric:tabular-nums}
.rc-choice.is-plan{background:var(--c-plan);border-color:var(--c-plan);color:#fff}
.rc-choice.is-wrong{opacity:.7}
.rc-q .sim-bar{margin-top:6px}
.rc-live{font-size:16px;font-weight:750}
.rc-live b{font-variant-numeric:tabular-nums}
.rc-live .pos{color:var(--mint-deep)}.rc-live .neg{color:var(--coral-deep)}
.rc-result{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;margin-top:6px;padding:12px 8px;border-top:2px solid var(--ink);font-size:17px;font-weight:800}
.rc-result .rc-resbox{font-size:17px;padding:0 12px}
.rc-shown{flex-basis:100%;font-size:13.5px;font-weight:650;color:var(--sun-deep)}
.rc-vp .rc-key,.rc-vp .rc-verdict{display:none}
.rc-vp.has-gap .c-spent .rc-colval{opacity:0}
/* v1.7 · receipt carousel: chart as tall as the receipt, stacked unit blocks, two-bar gap */
.rc-car{grid-template-columns:36px minmax(0,1fr) 36px}
.rc-body{min-width:0}
.rc-game .rc-prog,.rc-game .rc-formula{display:none}
.rc-layout{display:grid;grid-template-columns:minmax(0,1fr) 168px;gap:14px;align-items:stretch}
.rc-stage{min-width:0;display:flex}
.rc-stage > .rc{flex:1;margin-bottom:12px}
.rc-vp{position:relative;top:auto;display:flex;flex-direction:column;margin-bottom:12px}
.rc-chart{flex:1 1 auto;min-height:230px;height:auto;margin-top:28px}
.rc-col{display:block}
.rc-fill{position:absolute;inset-inline:0;bottom:0;height:0;display:flex;flex-direction:column-reverse;gap:2px;border-radius:8px 8px 0 0;overflow:visible;transition:height 1s var(--ease);background:none!important}
.rc-unit{position:relative;min-height:0;display:grid;place-items:center;border-radius:6px 6px 0 0;overflow:hidden}
.rc-unit + .rc-unit{border-radius:6px 6px 0 0}
.c-plan .rc-unit{background:var(--c-plan)}
.c-spent .rc-unit{background:var(--c-spent)}
.rc-unit.extra{background:repeating-linear-gradient(135deg,var(--c-spent) 0 6px,color-mix(in srgb,var(--c-spent) 70%,#fff) 6px 11px);outline:2.5px dashed var(--coral);outline-offset:-2.5px}
.rc-uicon{font-size:18px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));white-space:nowrap;color:#fff;font-weight:800;font-size:16px}
.rc-unit em{position:absolute;top:4px;inset-inline-end:4px;font-style:normal;font-size:10.5px;font-weight:900;color:#fff;background:var(--coral);padding:1px 6px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.rc-col.is-zero .rc-fill{height:6px!important;background:var(--c-plan)!important;border-radius:4px}
.c-spent.is-zero .rc-fill{background:var(--c-spent)!important}
.rc-band{position:absolute;inset-inline:0;bottom:0;height:0;pointer-events:none;z-index:2;display:none}
.rc-band.on{display:block}
/* saving: the top of Planned is dashed out (kept money); the matching space on Spent is outlined */
.c-plan .rc-band.is-saved{background:repeating-linear-gradient(135deg,rgba(255,255,255,.8) 0 5px,rgba(255,255,255,.35) 5px 10px);outline:2.5px dashed var(--mint);outline-offset:-2.5px}
.c-spent .rc-band.is-saved{background:color-mix(in srgb,var(--mint) 12%,transparent);outline:2.5px dashed var(--mint);outline-offset:-2.5px}
/* extra: the part of Spent above the plan is dashed out (unplanned money); the matching space on Planned is outlined */
.c-spent .rc-band.is-over{background:repeating-linear-gradient(135deg,rgba(255,255,255,.8) 0 5px,rgba(255,255,255,.35) 5px 10px);outline:2.5px dashed var(--coral);outline-offset:-2.5px}
.c-plan .rc-band.is-over{background:color-mix(in srgb,var(--coral) 12%,transparent);outline:2.5px dashed var(--coral);outline-offset:-2.5px}
.rc-gaplabel{position:absolute;inset-inline-start:50%;transform:translateX(-50%);z-index:4;font-size:13.5px;font-weight:900;padding:3px 10px;border-radius:999px;background:#fff;box-shadow:0 2px 8px -2px rgba(42,38,49,.4);font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none}
[dir=rtl] .rc-gaplabel{transform:translateX(50%)}
.rc-gaplabel.is-saved{color:var(--mint-deep);border:2px solid var(--mint)}
.rc-gaplabel.is-over{color:var(--coral-deep);border:2px solid var(--coral)}
.rc-gap{display:none!important}
.rc-drag{inset-inline:-10px;border-top:3px solid var(--ink);z-index:3;pointer-events:none}
.rc-knob{animation:none!important;pointer-events:auto;cursor:grab;width:28px;height:28px;inset-inline-end:-14px;touch-action:none}
.rc-knob:active{cursor:grabbing}
.rc-vp.is-live .rc-chart::before{content:"";position:absolute;inset:-14px -22px;z-index:0}
.rc-vp.has-gap .c-spent .rc-colval,.rc-vp.has-gap .c-plan .rc-colval{opacity:1}
.rc-colval{z-index:3}
.rc-tag{flex-wrap:wrap}
.rc-tagsave{flex-basis:100%;text-align:end;font-size:13px;font-weight:800;color:var(--mint-deep)}
.rc-qty{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;padding:8px 8px 10px;font-size:15px;font-weight:700;border-top:1px solid var(--line)}
.rc-icons{font-size:18px;letter-spacing:2px}
.rc-extraicons{display:inline-block;padding:0 4px;border-radius:8px;outline:2px dashed var(--coral);outline-offset:1px;background:var(--coral-soft);margin-inline-start:3px}

.rc-after{margin-top:2px}
.rc-after .fb{margin-top:0}
.rc-sumslot .rc-sum{padding:6px 4px}

/* v1.8 · receipt game, simple: one fixed card, two bars, one question area that swaps in place */
.rq-game{--c-plan:#3b6fd8;--c-plan-soft:#e3ebfb;--c-plan-deep:#1f449c;--c-spent:#ec7a1c;--c-spent-soft:#fde8d6;--c-spent-deep:#8a3f06}
.rq-slot{min-width:0}
.rq-card{border:1.5px solid var(--line);border-radius:var(--r-lg);background:var(--panel);padding:20px 22px 18px;display:flex;flex-direction:column;animation:rqIn .35s var(--ease)}
@keyframes rqIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rq-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rq-emoji{font-size:26px;line-height:1}
.rq-name{margin:0;font-family:var(--display);font-size:20px;font-weight:800;flex:1;min-width:0}
.rq-sticker{position:absolute;grid-column:4/5;grid-row:1/2;justify-self:start;margin-inline-start:12px;z-index:3;display:inline-flex;white-space:nowrap;flex-direction:column;align-items:center;background:var(--ink);color:#fff;border-radius:10px;padding:5px 12px;transform:rotate(-3deg);font-family:var(--display);line-height:1.2}
.rq-sticker b{font-size:14px;font-weight:850;letter-spacing:.03em}
.rq-sticker small{font-size:12px;font-weight:650;opacity:.85}
.rq-story{font-size:17px;line-height:1.55;margin:12px 0 4px}
.rq-line{display:block}
.rq-chart{position:relative;display:grid;grid-template-columns:76px 88px 76px 128px;justify-content:center;padding-inline-start:128px;height:220px;margin:22px 0 62px}
.rq-bar{position:relative;grid-row:1}
.rq-bar.b-plan{grid-column:1/2}.rq-bar.b-paid{grid-column:3/4}
.rq-track{position:absolute;inset:0;border-radius:10px 10px 4px 4px;background:var(--rail);box-shadow:inset 0 -2px 0 var(--line-strong)}
.rq-fill{position:absolute;inset-inline:0;bottom:0;height:0;border-radius:10px 10px 4px 4px;transition:height .9s var(--ease);display:flex;justify-content:center;align-items:flex-start;padding-top:8px;overflow:hidden}
.b-plan .rq-fill{background:var(--c-plan)}.b-paid .rq-fill{background:var(--c-spent)}
.rq-bar.is-zero .rq-fill{height:5px!important;padding:0}
.rq-icons{font-size:20px;line-height:1;letter-spacing:2px}
.rq-val{display:block;font-size:15px;font-weight:850;font-variant-numeric:tabular-nums;white-space:nowrap;min-height:1.3em;opacity:0;transition:opacity .4s .5s}
.rq-bar.is-set .rq-val{opacity:1}
.b-plan .rq-val{color:var(--c-plan-deep)}.b-paid .rq-val{color:var(--c-spent-deep)}
.rq-lab{position:absolute;top:calc(100% + 8px);inset-inline:-14px;text-align:center;font-family:var(--display);font-size:14.5px;font-weight:750;line-height:1.3}
.b-plan .rq-lab{color:var(--c-plan-deep)}.b-paid .rq-lab{color:var(--c-spent-deep)}
.rq-bar:not(.is-set) .rq-lab{color:var(--muted)}
.rq-gap{position:absolute;grid-column:1/4;grid-row:1/2;inset-inline:-10px;height:0;z-index:2;display:grid;place-items:center;transition:height .7s var(--ease);overflow:visible;pointer-events:none}
.rq-gap.is-saved{background:color-mix(in srgb,var(--mint) 22%,transparent);border-block:2.5px solid var(--mint);color:var(--mint-deep)}
.rq-gap.is-over{background:color-mix(in srgb,var(--coral) 20%,transparent);border-block:2.5px solid var(--coral);color:var(--coral-deep)}
.rq-gap span{font-family:var(--display);font-size:15px;font-weight:850;background:var(--panel);padding:1px 7px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px currentColor}
.rq-ask{display:flex;flex-direction:column;justify-content:flex-start;border-top:1.5px solid var(--line);padding-top:14px}
.rq-ask > *{animation:rqIn .3s var(--ease)}
.rq-q{font-family:var(--display);font-size:17.5px;font-weight:780;margin:0 0 10px}
.rq-choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rq-choice{font:inherit;font-family:var(--display);font-size:16.5px;font-weight:750;padding:12px 14px;border-radius:var(--r-md);border:1.5px solid var(--line-strong);background:var(--panel);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,transform .15s var(--spring)}
.rq-choice:hover:not(:disabled){border-color:var(--plum);transform:translateY(-1px)}
.rq-choice:disabled{cursor:default}
.rq-choice.is-plan{border-color:var(--c-plan);background:var(--c-plan-soft);color:var(--c-plan-deep)}
.rq-choice.is-wrong{border-color:var(--sun);background:var(--sun-soft);color:var(--sun-deep);opacity:.7;animation:shake .36s}
.rq-hint{min-height:1.5em;margin:10px 0 0;font-size:15.5px;line-height:1.45;color:var(--sun-deep)}

/* ---------- FLIP: flip & reveal cards (front = what everyone sees, back = behind the scenes) ---------- */
function flipCard(card, cfg, ctx, onDone) {

  const back = face(card.back, 'flip-back', h('span', { text: '🔄 ' + (cfg.backLabel || t('backLabel')) }));

SIMS.FLIP = (cfg, ctx) => cfg.cards.length === 1 ? flipCard(cfg.cards[0], cfg, ctx, () => ctx.complete()) : carousel(cfg.cards, (c, k, done) => flipCard(c, cfg, ctx, done), ctx);

/* ---------- Money Bar: planned vs spent, green = saved, coral = extra ---------- */
