/* ---------- number keypad (receipt game) ---------- */
function keypad(o) {
  let val = '';
  const show = () => o.onInput(val);
  const press = k => {
    if (k === 'del') val = val.slice(0, -1);
    else if (k === '-') val = val.startsWith('-') ? val.slice(1) : '-' + val;
    else if (val.replace('-', '').length < 6) val = (val === '0' ? '' : val === '-0' ? '-' : val) + k;
    show();
  };
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', o.minus ? '-' : null, '0', 'del'];
  const grid = h('div', { class: 'kp-grid' }, keys.map(k => k == null ? h('span') :
    h('button', { class: 'kp-key' + (k === '-' ? ' kp-minus' : k === 'del' ? ' kp-del' : ''), type: 'button', 'aria-label': k === 'del' ? t('kpDelete') : k === '-' ? t('kpMinus') : k, onclick: () => press(k) }, k === 'del' ? '⌫' : k === '-' ? '−' : k)));
  const checkBtn = h('button', { class: 'btn kp-check', type: 'button', onclick: () => { if (val && val !== '-') o.onCheck(Number(val)); } }, t('check'), svg(ICON.check, 15));
  const note = h('div', { class: 'kp-note', 'aria-live': 'polite' });
  const el = h('div', { class: 'kp', role: 'group', 'aria-label': strip(o.prompt) },
    h('p', { class: 'kp-prompt', html: o.prompt }), note, grid, checkBtn);
  const onKey = e => {
    if (!el.isConnected) { removeEventListener('keydown', onKey); return; }
    if (!el.offsetParent || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target && e.target.closest && e.target.closest('input,textarea,select,[contenteditable]')) return;
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('del');
    else if ((e.key === '-' || e.key === '−') && o.minus) press('-');
    else if (e.key === 'Enter') { e.preventDefault(); checkBtn.click(); return; }
    else return;
    e.preventDefault();
  };
  addEventListener('keydown', onKey);
  return { el, note, reset() { val = ''; show(); }, destroy() { removeEventListener('keydown', onKey); el.remove(); } };
}

/* =====================================================================
   MCQ-S · stepped card: 1 spot the trigger → 2 check the logic → 3 decide
   ===================================================================== */
function steppedCard(card, cfg, ctx, onSolved) {
  /* A checklist that fills itself in: every step is one row on a numbered rail.
     Upcoming rows are faded; the open row is a white card; an answered row closes to one line
     (answer pill + short reason) and, after a short pause, the next row opens by itself. */
  const root = h('div', { class: 'qcard stc' });
  if (card.label) root.append(h('div', { class: 'qcard-label', text: card.label }));
  if (card.image) root.append(media(card.image, 'hero'));
  if (card.setup) root.append(h('div', { class: 'qcard-setup', html: card.setup }));
  const ANS = cfg.answers || [t('yes'), t('no'), t('notSure')];
  const d = card.decide;
  const steps = [{ kind: 'trigger', label: card.triggerQ || cfg.triggerQ || t('stTrigger') }]
    .concat(cfg.checks.map((ch, k) => ({ kind: 'check', k, label: ch.label })), [{ kind: 'decide', label: d.q }]);
  const list = h('ol', { class: 'stc-list' });
  const CAPS = cfg.groups || [t('stCapEmo'), t('stCapLogic'), t('stCapDecide')];
  const capAt = { 0: CAPS[0], 1: CAPS[1], [steps.length - 1]: CAPS[2] };
  const rows = steps.map((st, i) => {
    if (capAt[i]) list.append(h('li', { class: 'stc-cap' + (i === 0 ? ' is-first' : ''), 'aria-hidden': 'true' }, h('span'), h('span', { class: 'stc-cap-t', text: capAt[i] })));
    const dot = h('span', { class: 'stc-dot', 'aria-hidden': 'true', text: i + 1 });
    const side = h('span', { class: 'stc-side' });
    const more = h('div', { class: 'stc-more' });
    const li = h('li', { class: 'stc-item is-todo' + (st.kind === 'decide' ? ' is-decide' : '') }, dot,
      h('div', { class: 'stc-body' }, h('div', { class: 'stc-head' }, h('span', { class: 'stc-lab', html: st.label }), side), more));
    list.append(li);
    return { st, li, dot, side, more };
  });
  root.append(list);
  function setState(r, cls) { r.li.classList.remove('is-todo', 'is-open', 'is-done'); r.li.classList.add(cls); }
  function close(r, ans, kind, reason, extra) {
    setState(r, 'is-done'); r.li.classList.remove('ok', 'miss', 'pick'); r.li.classList.add(kind);
    r.dot.textContent = kind === 'miss' ? '✕' : '✓';
    r.side.replaceChildren(h('span', { class: 'stc-ans ' + kind, html: ans }));
    r.reason = reason;
    if (kind === 'pick') { r.more.replaceChildren(...[h('p', { class: 'stc-reason', html: reason }), extra].filter(Boolean)); return; }
    /* the reason shows for a moment, then folds away; tapping a finished row shows it again */
    r.more.replaceChildren(h('div', { class: 'stc-fold' }, h('div', null, h('p', { class: 'stc-reason', html: reason }))));
    if (!r.li.dataset.peek) {
      r.li.dataset.peek = '1';

    }
  }
  /* no delay: the next row opens at once. The latest reason stays visible under its row while the learner
     works on the next step, and folds away when the next answer comes in (only one reason on screen at a time). */
  function openNext(i) { rows.slice(0, i - 1).forEach(r => r.li.classList.add('is-folded')); open(i); }
  function open(i) {
    const r = rows[i];
    setState(r, 'is-open');
    ({ trigger: openTrigger, check: openCheck, decide: openDecide })[r.st.kind](r, i);
    ctx.nudge(r.li);
  }
  function openTrigger(r, i) {
    const opts = h('div', { class: 'opts opts-col stc-trig' }), slot = h('div', { class: 'fb-slot' });
    let done = false;
    cfg.triggers.forEach(tr => {
      const b = h('button', { class: 'opt', type: 'button' }, h('span', { class: 'opt-row' }, h('span', { class: 'opt-text', text: tr.label })));
      b.addEventListener('click', () => {
        if (done) return;
        const ok = tr.id === card.trigger.correct;
        ctx.answer({ cardId: card.id, step: 'trigger', optionId: tr.id, correct: ok });
        if (!ok) { b.classList.add('is-wrong'); b.disabled = true; slot.replaceChildren(fb('try', (card.trigger.hints && card.trigger.hints[tr.id]) || card.trigger.hint)); ctx.nudge(slot); return; }
        done = true;
        close(r, tr.label, 'ok', card.trigger.good);
        openNext(i + 1);
      });
      opts.append(b);

    r.more.replaceChildren(opts, slot);

    const ch = cfg.checks[r.st.k], want = card.checks[r.st.k];

      const b = h('button', { class: 'stc-btn', type: 'button', text: a });
      b.addEventListener('click', () => {
        if (seg.dataset.done) return;
        seg.dataset.done = '1';
        const ok = a === want.a;
        ctx.answer({ cardId: card.id, step: 'check', check: ch.id, answer: a, correct: ok });
        close(r, want.a, ok ? 'ok' : 'miss', (ok ? '' : '<strong>' + t('stItsA', want.a) + '</strong> ') + want.why);
        openNext(i + 1);

      seg.append(b);
    });
    r.side.replaceChildren(seg);
  }
  function openDecide(r) {
    /* no wrong answer: the choice closes into the list like the other steps (purple = chosen)
       and its outcome becomes the reason line */
    const opts = h('div', { class: 'opts ' + (d.options.every(o => strip(o.text).length <= 16) ? 'opts-row' : 'opts-col') });
    let first = true;
    function choose(o) {
      ctx.answer({ cardId: card.id, step: 'decide', choice: o.id || o.text });
      rows.forEach(x => { if (x !== r) x.li.classList.add('is-folded'); });
      close(r, o.text, 'pick', o.fb);
      if (first) { first = false; onSolved && onSolved(); }
      ctx.nudge(r.li);
    }
    d.options.forEach(o => {
      opts.append(h('button', { class: 'opt', type: 'button', onclick: () => choose(o) }, h('span', { class: 'opt-row' }, h('span', { class: 'opt-text', html: o.text }))));
    });
    r.more.replaceChildren(opts);
  }
  open(0);
  return root;
}

let uidN = 0;

  opts = opts || {};

  if (cfg.title || cfg.description) frame.append(h('div', { class: 'sim-head' }, cfg.title ? h('h3', { class: 'sim-title', html: cfg.title }) : null, cfg.description ? h('p', { class: 'sim-desc', html: cfg.description }) : null));
  else frame.classList.add('no-head');
  let completed = false;
  const ctx = {
    simId, uid: 'u' + (++uidN), nudge, toast, confetti,
    answer: d => host.emit('answer', Object.assign({ simId, simType: cfg.type, lessonId: opts.lessonId || LESSON.id }, d)),
    complete: () => {
      if (completed) return;
      completed = true;

}

  const sbToggle = h('button', { class: 'sb-toggle', type: 'button', 'aria-label': 'Hide the lesson list', title: 'Hide the lesson list', onclick: () => setCollapsed(true) }, '«');

  function setCollapsed(on) { app.classList.toggle('sb-collapsed', on); (on ? sbOpen : sbToggle).focus({ preventScroll: true }); }
  sb.append(sbToggle);
  lessons.forEach((L, i) => {
    built.push(buildLesson(L, {
      goSection: k => goSection(i, k),
      onNext: single ? null : () => show(i + 1),
      onProgress: () => { if (i === cur) paintProgress(); }
    }));
  });

  const list = single && first.course ? first.course : lessons.map(L => ({ num: L.num, title: L.title }));
  list.forEach(c => {
    const i = lessons.findIndex(L => L.num === c.num);
    const item = i >= 0 && !single
      ? h('button', { class: 'sb-lesson', type: 'button', onclick: () => { show(i); app.classList.remove('nav-open'); } }, h('span', { class: 'n', text: String(c.num).padStart(2, '0') }), h('span', { text: c.title }))
      : h('a', { class: 'sb-lesson' + (c.locked ? ' is-locked' : ''), href: i >= 0 ? '#top' : c.href, target: c.locked ? '_parent' : null, title: c.locked ? 'Locked · request a call to unlock' : null }, h('span', { class: 'n', text: String(c.num).padStart(2, '0') }), h('span', { text: c.title }), c.locked ? h('span', { class: 'sb-lock', 'aria-label': 'Locked', text: '🔒' }) : null);
    const ul = i >= 0 ? h('ul', { class: 'sb-sections' }, built[i].secButtons.map(b => h('li', null, b))) : null;
    sb.append(item);
    if (ul) sb.append(ul);
    navItems.push({ i, item, ul });
  });
  const tplHref = opts.templatesHref || first.templatesHref;
  if (tplHref) sb.append(h('div', { class: 'sb-label', text: t('builders') }), h('a', { class: 'sb-lesson', href: tplHref }, h('span', { class: 'n', text: '⚙︎' }), h('span', { text: t('templates') })));
  sb.append(h('div', { class: 'sb-progress' }, progText, h('div', { class: 'track' }, progFill)));

  built.forEach(b => main.append(b.page));
  app.append(sb, sbOpen, scrim, h('div', { style: 'flex:1;min-width:0' }, topbar, main));
  document.body.innerHTML = '';
  document.body.append(app);

  function paintProgress() {
    const b = built[cur];
    progText.textContent = t('progressDone', b.done(), b.total);
    progFill.style.width = (b.total ? b.done() / b.total * 100 : 0) + '%';
  }
  function show(i, opt) {
    if (i < 0 || i >= lessons.length) return;
    cur = i;
    built.forEach((b, k) => { b.page.hidden = k !== i; });
    navItems.forEach(n => {
      const on = n.i === i;
      n.item.classList.toggle('current', on);
      if (on) n.item.setAttribute('aria-current', 'page'); else n.item.removeAttribute('aria-current');
      if (n.ul) n.ul.hidden = !on;
    });
    tbTitle.textContent = t('lesson') + ' ' + lessons[i].num;
    paintProgress();
    if (!single) { try { history.replaceState(null, '', '#lesson-' + lessons[i].num); } catch (e) { } }
    if (!(opt && opt.keepScroll)) scrollTo({ top: 0, behavior: 'auto' });
    spy();
  }
  function goSection(i, k) {
    if (i !== cur) show(i, { keepScroll: true });
    const el = built[i].secEls[k];
    requestAnimationFrame(() => el.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth' }));
    app.classList.remove('nav-open');
  }
  function spy() {
    const b = built[cur], L = lessons[cur];
    let c = 0;
    b.secEls.forEach((s, k) => { if (s.getBoundingClientRect().top < innerHeight * .4) c = k; });
    b.secButtons.forEach((x, k) => x.classList.toggle('active', k === c));
    tbSec.textContent = L.sections[c] ? L.sections[c].title : '';
  }
  addEventListener('scroll', spy, { passive: true });
  const fromHash = () => { const m = /lesson-(\d+)/.exec(location.hash || ''); const i = m ? lessons.findIndex(L => String(L.num) === m[1]) : -1; return i; };
  addEventListener('hashchange', () => { const i = fromHash(); if (i >= 0 && i !== cur) show(i); });
  built.forEach(b => b.paintEnd());
  show(Math.max(0, fromHash()));
  host.emit('ready', { lessons: lessons.map(L => L.id) });
}
function renderLesson(L) { renderCourse([L]); }

window.Yabi = { SIMS, mountSim, renderLesson, renderCourse, h, media, fb, moneyBar, toast, confetti, host, store, t, fmt, svg, ICON };
const boot = () => window.YABI_LESSONS ? renderCourse(window.YABI_LESSONS, window.YABI_COURSE_OPTS) : renderLesson(window.YABI_LESSON);
if ((window.YABI_LESSONS || window.YABI_LESSON) && !window.YABI_NO_AUTORENDER) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}
})();

</script>
